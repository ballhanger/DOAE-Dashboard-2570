<script>
        // ใช้ Path สัมพัทธ์ที่รองรับทั้ง Local และ GitHub Pages Sub-path
        const DB_JSON_URL = "data/dashboard_db.json";
        let DASHBOARD_DB = null;
        let MASTER_INDEX = [];
        let currentProjectIndex = 0; 

        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        let currentQuarter = 1;

        if (currentMonth >= 10 && currentMonth <= 12) { currentQuarter = 1; } 
        else if (currentMonth >= 1 && currentMonth <= 3) { currentQuarter = 2; } 
        else if (currentMonth >= 4 && currentMonth <= 6) { currentQuarter = 3; } 
        else if (currentMonth >= 7 && currentMonth <= 9) { currentQuarter = 4; }

        const kpiColorThemes = [
            { planBg: 'bg-emerald-300', planBorder: 'border-emerald-400', planText: 'text-emerald-700', darkText: 'text-emerald-900', actBg: 'bg-emerald-500', actBorder: 'border-emerald-600', actText: 'text-emerald-600', legendPlanBg: 'bg-emerald-300', legendActBg: 'bg-emerald-500', cardPlanBg: 'bg-gradient-to-br from-emerald-200 to-emerald-300', cardPlanText: 'text-emerald-900', cardActBg: 'bg-gradient-to-br from-emerald-500 to-emerald-600', cardActText: 'text-white', cardPctBg: 'bg-emerald-50', cardPctText: 'text-emerald-800' },
            { planBg: 'bg-blue-300', planBorder: 'border-blue-400', planText: 'text-blue-700', darkText: 'text-blue-900', actBg: 'bg-blue-500', actBorder: 'border-blue-600', actText: 'text-blue-600', legendPlanBg: 'bg-blue-300', legendActBg: 'bg-blue-500', cardPlanBg: 'bg-gradient-to-br from-blue-200 to-blue-300', cardPlanText: 'text-blue-900', cardActBg: 'bg-gradient-to-br from-blue-500 to-blue-600', cardActText: 'text-white', cardPctBg: 'bg-blue-50', cardPctText: 'text-blue-800' },
            { planBg: 'bg-purple-300', planBorder: 'border-purple-400', planText: 'text-purple-700', darkText: 'text-purple-900', actBg: 'bg-purple-500', actBorder: 'border-purple-600', actText: 'text-purple-600', legendPlanBg: 'bg-purple-300', legendActBg: 'bg-purple-500', cardPlanBg: 'bg-gradient-to-br from-purple-200 to-purple-300', cardPlanText: 'text-purple-900', cardActBg: 'bg-gradient-to-br from-purple-500 to-purple-600', cardActText: 'text-white', cardPctBg: 'bg-purple-50', cardPctText: 'text-purple-800' },
            { planBg: 'bg-pink-300', planBorder: 'border-pink-400', planText: 'text-pink-700', darkText: 'text-pink-900', actBg: 'bg-pink-500', actBorder: 'border-pink-600', actText: 'text-pink-600', legendPlanBg: 'bg-pink-300', legendActBg: 'bg-pink-500', cardPlanBg: 'bg-gradient-to-br from-pink-200 to-pink-300', cardPlanText: 'text-pink-900', cardActBg: 'bg-gradient-to-br from-pink-500 to-pink-600', cardActText: 'text-white', cardPctBg: 'bg-pink-50', cardPctText: 'text-pink-800' }
        ];

        const getDonutStatusColorConfig = (status) => {
            if (status === "เป็นไปตามแผน") return { ring: '#10B981', badgeBg: 'bg-emerald-500', badgeText: 'text-slate-900', pctText: 'text-slate-900', border: 'border-emerald-600', subBg: 'bg-white', subText: 'text-emerald-700', subBorder: 'border-emerald-200', animClass: 'anim-success-alt', subtext: 'ร้อยละ ≥ 100', sepBorder: 'border-slate-800/20' };
            if (status === "ล่าช้า") return { ring: '#FACC15', badgeBg: 'bg-amber-400', badgeText: 'text-slate-900', pctText: 'text-slate-900', border: 'border-amber-500', subBg: 'bg-white', subText: 'text-amber-800', subBorder: 'border-amber-200', animClass: 'anim-warning-alt', subtext: 'ร้อยละ 50 - 99', sepBorder: 'border-slate-800/20' }; 
            if (status === "เสี่ยง") return { ring: '#EF4444', badgeBg: 'bg-red-500', badgeText: 'text-white', pctText: 'text-white', border: 'border-red-600', subBg: 'bg-white', subText: 'text-red-700', subBorder: 'border-red-200', animClass: 'anim-danger-alt', subtext: 'ต่ำกว่าร้อยละ 50', sepBorder: 'border-white/30' };
            if (status === "ยังไม่ดำเนินการ" || status === "ไม่มี") return { ring: '#1E293B', badgeBg: 'bg-slate-800', badgeText: 'text-white', pctText: 'text-white', border: 'border-slate-900', subBg: 'bg-white', subText: 'text-slate-800', subBorder: 'border-slate-300', animClass: 'anim-critical-alt', subtext: 'ผลงาน = 0', sepBorder: 'border-white/20' };
            if (status.includes("มีแผนอยู่ใน")) return { ring: '#94A3B8', badgeBg: 'bg-slate-300', badgeText: 'text-slate-800', pctText: 'text-slate-800', border: 'border-slate-400', subBg: 'bg-white', subText: 'text-slate-700', subBorder: 'border-slate-200', animClass: '', subtext: 'ยังไม่ถึงช่วงแผนงาน', sepBorder: 'border-slate-400/50' };
            return { ring: '#CBD5E1', badgeBg: 'bg-slate-200', badgeText: 'text-slate-700', pctText: 'text-slate-700', border: 'border-slate-300', subBg: 'bg-white', subText: 'text-slate-600', subBorder: 'border-slate-200', animClass: '', subtext: '-', sepBorder: 'border-slate-300/50' };
        };

        const getStatusEmoji = (status) => {
            if (status === "เป็นไปตามแผน") return "🟢";
            if (status === "ล่าช้า") return "🟡";
            if (status === "เสี่ยง") return "🔴";
            if (status === "ยังไม่ดำเนินการ" || status === "ไม่มี") return "⚫";
            if (status.includes("มีแผนอยู่ใน")) return "⚪";
            return "⚪";
        };

        const formatMoney = (num) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        const formatAutoDecimal = (num) => {
            if (num % 1 !== 0) return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
            return new Intl.NumberFormat('th-TH').format(num); 
        };

        const getSafeNum = (row, targetKey) => {
            const cleanTarget = targetKey.replace(/\s+/g, '');
            let foundVal = "0";
            for (let k in row) { if (k.replace(/\s+/g, '') === cleanTarget) { foundVal = row[k]; break; } }
            if (foundVal === null || foundVal === undefined) foundVal = "0";
            return parseFloat(String(foundVal).replace(/,/g, '')) || 0;
        };

        function getDynamicStatus(row, quarter) {
            for (let i = quarter; i >= 1; i--) {
                const cleanTarget = `สถานะไตรมาส${i}`;
                for (let k in row) {
                    if (k.replace(/\s+/g, '') === cleanTarget) {
                        let s = row[k];
                        if (s && s.trim() !== "") return s.replace(/[🔴🟡🟢⚫⚪❌]/g, '').trim();
                    }
                }
            }
            return "ยังไม่ดำเนินการ";
        }

        function getPctVsCurrentPlan(p1, p2, p3, p4, actual, q) {
            let pCum = 0;
            if (q >= 1) pCum += p1;
            if (q >= 2) pCum += p2;
            if (q >= 3) pCum += p3;
            if (q >= 4) pCum += p4;

            if (pCum === 0) return actual > 0 ? 100 : 0; 
            return (actual / pCum) * 100;
        }

        function determineStatus(p1, p2, p3, p4, actual, q) {
            let pCum = 0;
            if (q >= 1) pCum += p1;
            if (q >= 2) pCum += p2;
            if (q >= 3) pCum += p3;
            if (q >= 4) pCum += p4;

            if (pCum === 0) {
                if (q === 1) return "มีแผนอยู่ในไตรมาสถัดไป";
                else if (q === 2) return "มีแผนอยู่ใน Q3/Q4";
                else if (q === 3) return "มีแผนอยู่ใน Q4";
                else return "ยังไม่ดำเนินการ";
            }
            
            if (actual >= pCum) return "เป็นไปตามแผน";
            if (actual === 0) return "ยังไม่ดำเนินการ";
            
            let pct = (actual / pCum) * 100;
            return pct >= 50 ? "ล่าช้า" : "เสี่ยง";
        }

        function toggleDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'scale-95');
                    menu.classList.add('opacity-100', 'scale-100');
                    icon.classList.add('rotate-180');
                }, 10);
            } else { closeDropdown(); }
        }

        function closeDropdown() {
            const menu = document.getElementById('dropdown-menu');
            const icon = document.getElementById('dropdown-icon');
            menu.classList.remove('opacity-100', 'scale-100');
            menu.classList.add('opacity-0', 'scale-95');
            icon.classList.remove('rotate-180');
            setTimeout(() => { menu.classList.add('hidden'); }, 200);
        }

        document.addEventListener('click', (event) => {
            const container = document.getElementById('custom-dropdown-container');
            if (container && !container.contains(event.target)) closeDropdown();
        });

        window.navigateProject = function(event, index) {
            if (event.ctrlKey || event.metaKey || event.button === 1) return; 
            event.preventDefault();
            selectProject(index);
        }

        window.selectProject = function(index, skipPushState = false) {
            closeDropdown();
            loadProject(index, skipPushState);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.navigatePrev = function() { 
            let prevIdx = currentProjectIndex - 1;
            while(prevIdx >= 0 && MASTER_INDEX[prevIdx] && MASTER_INDEX[prevIdx].name.includes("งบประมาณ")) prevIdx--;
            if (prevIdx >= 0) selectProject(prevIdx); 
        }
        
        window.navigateNext = function() { 
            let nextIdx = currentProjectIndex + 1;
            while(nextIdx < MASTER_INDEX.length && MASTER_INDEX[nextIdx] && MASTER_INDEX[nextIdx].name.includes("งบประมาณ")) nextIdx++;
            if (nextIdx < MASTER_INDEX.length) selectProject(nextIdx); 
        }

        window.addEventListener('popstate', function(e) {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            let idx = 0;
            if (idParam !== null && !isNaN(idParam)) idx = parseInt(idParam);
            selectProject(idx, true);
        });

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // ดึงข้อมูล JSON จาก data/dashboard_db.json
                const res = await fetch(DB_JSON_URL + '?_t=' + new Date().getTime());
                if (!res.ok) throw new Error("ไม่สามารถดาวน์โหลดไฟล์ฐานข้อมูลได้ (HTTP " + res.status + ")");
                
                DASHBOARD_DB = await res.json();
                MASTER_INDEX = DASHBOARD_DB.master_index || [];

                const list = document.getElementById('dropdown-list');
                list.innerHTML = '';
                const jumpContainer = document.getElementById('quick-jump-buttons');
                jumpContainer.innerHTML = '';
                
                MASTER_INDEX.forEach((item, index) => {
                    const isAll = item.url === "AUTO_ALL";
                    const isGroup = item.url === "AUTO_GROUP";
                    const isSub = item.name.trim().startsWith("-"); 
                    
                    const isHiddenBudget = item.name.includes("งบประมาณ");
                    if (isHiddenBudget) return; 

                    const seqStr = String(item.seq).trim();
                    const prefix = (seqStr && seqStr !== "0") ? (seqStr.includes('.') ? `${seqStr} ` : `${seqStr}. `) : '';
                    const displayName = `${prefix}${item.name.replace(/^- /, '')}`;

                    const li = document.createElement('li');
                    li.title = displayName; 
                    let classes = "px-4 py-3 cursor-pointer transition-colors flex items-center pt-1 leading-snug block w-full hover:no-underline focus:outline-none ";
                    
                    if (isAll) classes += "bg-emerald-600 text-white font-black sticky top-0 z-20 hover:bg-emerald-700 shadow-md border-b border-emerald-800 text-base sm:text-lg";
                    else if (isGroup || (!isGroup && !isSub)) classes += "bg-white text-slate-800 font-extrabold hover:bg-slate-50 border-b border-slate-100 text-sm sm:text-base";
                    else classes += "bg-white hover:bg-slate-50 text-slate-600 pl-6 sm:pl-8 text-xs sm:text-sm font-medium border-b border-slate-50 border-l-[3px] border-emerald-400";
                    
                    li.className = classes;
                    li.innerHTML = `
                        <a href="?id=${index}" onclick="navigateProject(event, ${index})" class="${classes}">
                            ${isAll ? '<svg class="w-5 h-5 mr-2 flex-shrink-0 text-amber-300" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>' : ''}
                            ${(isGroup || (!isGroup && !isSub)) && !isAll ? '<svg class="w-4 h-4 mr-2 flex-shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>' : ''}
                            <span class="truncate">${displayName}</span>
                        </a>
                    `;
                    list.appendChild(li);

                    if (!isAll && !isSub && seqStr && seqStr !== "0") {
                        const btn = document.createElement('a');
                        btn.href = `?id=${index}`;
                        btn.className = `quick-jump-btn quick-jump-btn-${index} w-8 h-8 lg:w-10 lg:h-10 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-50 hover:bg-emerald-100 text-slate-600 hover:text-emerald-700 font-extrabold text-xs lg:text-sm transition-all shadow-sm border border-slate-200 hover:scale-110 focus:outline-none pt-1`;
                        let cleanSeq = seqStr.replace(/\.$/, ''); 
                        btn.innerText = cleanSeq;
                        btn.title = item.name.replace(/^- /, '');
                        btn.onclick = (e) => navigateProject(e, index);
                        jumpContainer.appendChild(btn);
                    }
                });

                const urlParams = new URLSearchParams(window.location.search);
                const idParam = urlParams.get('id');
                let startIndex = 0;
                if (idParam !== null && !isNaN(idParam) && parseInt(idParam) >= 0 && parseInt(idParam) < MASTER_INDEX.length) {
                    startIndex = parseInt(idParam);
                }

                if(MASTER_INDEX.length > 0) await loadProject(startIndex, true);
                else document.getElementById('display-project-name').textContent = "ไม่พบข้อมูลในระบบ";
            } catch(e) {
                console.error("Error loading master index:", e);
                document.getElementById('display-project-name').textContent = "เกิดข้อผิดพลาดในการโหลดไฟล์ข้อมูล (ตรวจสอบ data/dashboard_db.json)";
            }
        });

        async function loadProject(index, skipPushState = false) {
            currentProjectIndex = index;

            if (!skipPushState) {
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + index;
                window.history.pushState({path:newUrl}, '', newUrl);
            }

            let prevIdx = index - 1;
            while(prevIdx >= 0 && MASTER_INDEX[prevIdx] && MASTER_INDEX[prevIdx].name.includes("งบประมาณ")) prevIdx--;
            let nextIdx = index + 1;
            while(nextIdx < MASTER_INDEX.length && MASTER_INDEX[nextIdx] && MASTER_INDEX[nextIdx].name.includes("งบประมาณ")) nextIdx++;

            const btnPrev = document.getElementById('dock-btn-prev');
            const btnNext = document.getElementById('dock-btn-next');
            if(btnPrev) btnPrev.disabled = (prevIdx < 0);
            if(btnNext) btnNext.disabled = (nextIdx >= MASTER_INDEX.length);

            document.querySelectorAll('.quick-jump-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-600', 'scale-110', 'shadow-md');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            });
            let parentIndex = index;
            const checkItem = MASTER_INDEX[index];
            if (checkItem && checkItem.name.trim().startsWith("-")) {
                for (let i = index; i >= 0; i--) {
                     if (!MASTER_INDEX[i].name.trim().startsWith("-") && MASTER_INDEX[i].url !== "AUTO_ALL") { parentIndex = i; break; }
                }
            }
            const activeBtn = document.querySelector(`.quick-jump-btn-${parentIndex}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
                activeBtn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'scale-110', 'shadow-md');
                activeBtn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            }

            const displayTitle = document.getElementById('display-project-name');
            const parentTitle = document.getElementById('display-parent-project-name'); 
            const dropdownText = document.getElementById('dropdown-text');
            const dropdownBtn = document.getElementById('dropdown-btn');
            
            const selectedItem = MASTER_INDEX[index];
            if (!selectedItem) return;

            const viewLevel = selectedItem.url === "AUTO_ALL" ? "ALL" : (selectedItem.url === "AUTO_GROUP" ? "GROUP" : "SINGLE");
            const isActivity = selectedItem.name.trim().startsWith("-");

            let opDate = selectedItem.opDate || (MASTER_INDEX[0] ? MASTER_INDEX[0].opDate : "") || "วันนี้";
            let bgDate = selectedItem.bgDate || (MASTER_INDEX[0] ? MASTER_INDEX[0].bgDate : "") || "วันนี้";

            document.getElementById('display-op-date').textContent = opDate;
            document.getElementById('display-bg-date').textContent = bgDate;

            document.getElementById('budget-cards-container').classList.add('hidden');
            document.getElementById('kpi-cards-container').classList.add('hidden');
            document.getElementById('donut-zone-header').classList.add('hidden'); 
            document.getElementById('pie-charts-container').classList.add('hidden');
            document.getElementById('bar-chart-main-container').classList.add('hidden');
            document.getElementById('status-summary-container').classList.add('hidden');
            document.getElementById('table-main-container').classList.add('hidden');
            document.getElementById('issues-main-container').classList.add('hidden');

            const seqStr = String(selectedItem.seq).trim();
            const prefix = (selectedItem.seq && seqStr !== "0") ? (seqStr.includes('.') ? `${seqStr} ` : `${seqStr}. `) : '';
            const fullDisplayName = `${prefix}${selectedItem.name.replace(/^- /, '')}`;
            
            dropdownText.textContent = fullDisplayName;
            dropdownBtn.title = fullDisplayName; 

            const cleanName = selectedItem.name.replace(/^- /, '');
            
            if (viewLevel === "ALL") {
                displayTitle.innerHTML = "ภาพรวมกรมส่งเสริมการเกษตร";
                parentTitle.classList.add('hidden');
            } else {
                if (isActivity) {
                    displayTitle.innerHTML = `<div class="flex items-start ml-4 md:ml-6"><span class="text-emerald-500 mr-2 shrink-0 font-black">↳</span><span class="text-[#1E3A8A]">${cleanName}</span></div>`;
                    if (selectedItem.group && selectedItem.group.trim() !== "") {
                        parentTitle.textContent = selectedItem.group; 
                        parentTitle.classList.remove('hidden');
                    } else {
                        parentTitle.classList.add('hidden');
                    }
                } else {
                    displayTitle.innerHTML = cleanName;
                    parentTitle.classList.add('hidden');
                }
            }

            try {
                let validFetches = [];

                if (viewLevel === "ALL") {
                    Object.keys(DASHBOARD_DB.projects_data || {}).forEach(idxStr => {
                        const idx = parseInt(idxStr);
                        const item = MASTER_INDEX[idx];
                        if (item) {
                            validFetches.push({
                                item: item,
                                originalIndex: idx,
                                data: DASHBOARD_DB.projects_data[idxStr] || []
                            });
                        }
                    });
                } else if (viewLevel === "GROUP") {
                    MASTER_INDEX.forEach((item, idx) => {
                        if (item.group === selectedItem.group && item.name.trim().startsWith("-")) {
                            validFetches.push({
                                item: item,
                                originalIndex: idx,
                                data: (DASHBOARD_DB.projects_data && DASHBOARD_DB.projects_data[String(idx)]) || []
                            });
                        }
                    });
                } else {
                    validFetches = [{
                        item: selectedItem,
                        originalIndex: index,
                        data: (DASHBOARD_DB.projects_data && DASHBOARD_DB.projects_data[String(index)]) || []
                    }];
                }

                if (validFetches.length === 0) {
                    displayTitle.textContent = "ไม่พบข้อมูลสำหรับโครงการนี้";
                    return;
                }

                let flatRows = [];
                validFetches.forEach(f => {
                    const fileItem = f.item;
                    (f.data || []).forEach(rawRow => {
                        let name = "-";
                        for(let k in rawRow) { if (k.replace(/\s+/g, '') === "โครงการ/กิจกรรม") { name = rawRow[k] || "-"; break; } }
                        
                        let unit = "ราย"; 
                        for(let k in rawRow) { if (k.replace(/\s+/g, '') === "หน่วยนับ") { unit = rawRow[k] || "ราย"; break; } }

                        let groupName = viewLevel === "ALL" ? (fileItem.group || "โครงการอื่นๆ") : (viewLevel === "GROUP" ? fileItem.name.replace(/^- /, '') : name);
                        let isBudget = name.includes("งบประมาณ");
                        
                        let rawTarget = getSafeNum(rawRow, "เป้าหมาย");
                        let p1 = getSafeNum(rawRow, "แผนไตรมาส1");
                        let p2 = getSafeNum(rawRow, "แผนไตรมาส2");
                        let p3 = getSafeNum(rawRow, "แผนไตรมาส3");
                        let p4 = getSafeNum(rawRow, "แผนไตรมาส4");
                        
                        let safeTarget = rawTarget > 0 ? rawTarget : (p1 + p2 + p3 + p4);

                        let issueText = "";
                        for(let k in rawRow) { if (k.replace(/\s+/g, '') === "ปัญหาและอุปสรรค") { issueText = rawRow[k] || ""; break; } }

                        flatRows.push({
                            originalName: name, groupName: groupName, unit: unit,
                            seq: fileItem.seq, dropdownIndex: f.originalIndex,
                            isKPI: name.includes("(KPI)"), isBudget: isBudget,
                            target: safeTarget, actual: getSafeNum(rawRow, "ผลการดำเนินงานสะสม"),
                            planQ1: p1, actualQ1: getSafeNum(rawRow, "ผลไตรมาส1"),
                            planQ2: p2, actualQ2: getSafeNum(rawRow, "ผลไตรมาส2"),
                            planQ3: p3, actualQ3: getSafeNum(rawRow, "ผลไตรมาส3"),
                            planQ4: p4, actualQ4: getSafeNum(rawRow, "ผลไตรมาส4"),
                            issue: issueText, 
                            dynamicStat: getDynamicStatus(rawRow, currentQuarter)
                        });
                    });
                });

                let synthesizedRows = [];
                if (viewLevel === "SINGLE") {
                    synthesizedRows = flatRows.map(r => ({
                        name: r.originalName, unit: r.unit, isKPI: r.isKPI, isBudget: r.isBudget,
                        seq: r.seq, dropdownIndex: r.dropdownIndex,
                        target: r.target, actual: r.actual,
                        planQ1: r.planQ1, planQ2: r.planQ2, planQ3: r.planQ3, planQ4: r.planQ4,
                        actualQ1: r.actualQ1, actualQ2: r.actualQ2, actualQ3: r.actualQ3, actualQ4: r.actualQ4,
                        status: r.dynamicStat,
                        issue: r.issue
                    }));
                } else {
                    let kpiAgg = {};
                    let budgetAgg = { target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, unit: "บาท" };
                    let hasBudget = false;
                    
                    flatRows.forEach(r => {
                        if (r.isBudget) {
                            hasBudget = true;
                            budgetAgg.target += r.target; budgetAgg.actual += r.actual;
                            budgetAgg.p1 += r.planQ1; budgetAgg.p2 += r.planQ2; budgetAgg.p3 += r.planQ3; budgetAgg.p4 += r.planQ4;
                            budgetAgg.a1 += r.actualQ1; budgetAgg.a2 += r.actualQ2; budgetAgg.a3 += r.actualQ3; budgetAgg.a4 += r.actualQ4;
                        } else if (r.isKPI) {
                            let key = `${r.groupName}_|_${r.unit}`; 
                            if (!kpiAgg[key]) {
                                let seqToUse = r.seq;
                                let dropIdxToUse = r.dropdownIndex;
                                if (viewLevel === "ALL") {
                                    const parentProj = MASTER_INDEX.find(m => m.name.trim() === r.groupName.trim() && m.url === "AUTO_GROUP");
                                    if (parentProj) {
                                        seqToUse = parentProj.seq;
                                        dropIdxToUse = MASTER_INDEX.indexOf(parentProj);
                                    } else {
                                        const parentProj2 = MASTER_INDEX.find(m => m.name.trim() === r.groupName.trim());
                                        if (parentProj2) {
                                            seqToUse = parentProj2.seq;
                                            dropIdxToUse = MASTER_INDEX.indexOf(parentProj2);
                                        }
                                    }
                                }
                                kpiAgg[key] = { name: r.groupName, unit: r.unit, seq: seqToUse, dropdownIndex: dropIdxToUse, target: 0, actual: 0, p1:0, p2:0, p3:0, p4:0, a1:0, a2:0, a3:0, a4:0, issues: [] };
                            }
                            kpiAgg[key].target += r.target; kpiAgg[key].actual += r.actual;
                            kpiAgg[key].p1 += r.planQ1; kpiAgg[key].p2 += r.planQ2; kpiAgg[key].p3 += r.planQ3; kpiAgg[key].p4 += r.planQ4;
                            kpiAgg[key].a1 += r.actualQ1; kpiAgg[key].a2 += r.actualQ2; kpiAgg[key].a3 += r.actualQ3; kpiAgg[key].a4 += r.actualQ4;
                            if (r.issue && r.issue.trim() !== "") kpiAgg[key].issues.push(`- ${r.issue}`);
                        }
                    });
                    
                    Object.values(kpiAgg).forEach(agg => {
                        synthesizedRows.push({
                            name: agg.name, unit: agg.unit, isBudget: false, isKPI: true, isAggregatedKPI: true,
                            seq: agg.seq, dropdownIndex: agg.dropdownIndex,
                            target: agg.target, actual: agg.actual,
                            planQ1: agg.p1, planQ2: agg.p2, planQ3: agg.p3, planQ4: agg.p4,
                            actualQ1: agg.a1, actualQ2: agg.a2, actualQ3: agg.a3, actualQ4: agg.a4,
                            status: determineStatus(agg.p1, agg.p2, agg.p3, agg.p4, agg.actual, currentQuarter),
                            issue: viewLevel === "GROUP" ? agg.issues.join("<br>") : ""
                        });
                    });
                    
                    if (hasBudget) {
                        synthesizedRows.push({
                            name: "งบประมาณรวม", unit: "บาท", isKPI: false, isBudget: true,
                            target: budgetAgg.target, actual: budgetAgg.actual,
                            planQ1: budgetAgg.p1, planQ2: budgetAgg.p2, planQ3: budgetAgg.p3, planQ4: budgetAgg.p4,
                            actualQ1: budgetAgg.a1, actualQ2: budgetAgg.a2, actualQ3: budgetAgg.a3, actualQ4: budgetAgg.a4,
                            status: determineStatus(budgetAgg.p1, budgetAgg.p2, budgetAgg.p3, budgetAgg.p4, budgetAgg.actual, currentQuarter),
                            issue: ""
                        });
                    }
                }
                
                const qText = document.getElementById('dynamic-quarter-text');
                if(qText) qText.textContent = `ณ ไตรมาสที่ ${currentQuarter}`;

                document.getElementById('bar-chart-main-container').classList.remove('hidden');
                document.getElementById('table-main-container').classList.remove('hidden');
                
                renderDashboardUI(synthesizedRows, viewLevel, isActivity);

            } catch (error) {
                console.error("Critical error in loadProject:", error);
            }
        }
    </script>
