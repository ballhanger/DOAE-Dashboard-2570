name: Auto Update e-Project Data

on:
  schedule:
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          EPROJECT_USER: ${{ secrets.EPROJECT_USER }}
          EPROJECT_PASS: ${{ secrets.EPROJECT_PASS }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data from e-Project [skip ci]" && git push)
